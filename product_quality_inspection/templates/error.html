{% extends "base.html" %}
{% block title %}Error {{ code }} · QualityTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="p-4 p-sm-5 rounded-4 card border-0 shadow-lg">
      <div class="display-1 fw-bold text-danger mb-2 font-monospace">{{ code }}</div>
      <h2 class="h4 fw-bold mb-3 text-light">{{ message }}</h2>
      <p class="text-muted mb-4">Please verify your user permissions or return to the main quality operations dashboard.</p>
      <div>
        <a class="btn btn-primary px-4" href="{{ url_for('index') }}">
          <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
