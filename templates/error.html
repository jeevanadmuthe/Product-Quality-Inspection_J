{% extends "base.html" %}
{% block title %}Error {{ code }} · QualityTrack{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 60px auto; text-align: center;">
  <div class="card-clean" style="padding: 40px 28px;">
    <div style="font-size: 3rem; font-weight: 800; color: var(--status-defect-dot); font-family: var(--font-mono); margin-bottom: 8px;">
      {{ code }}
    </div>
    <h1 style="font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">
      {{ message }}
    </h1>
    <p style="font-size: 0.86rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5;">
      The requested quality record could not be processed or found. Verify the record ID or return to the main dashboard.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center;">
      <a class="btn-custom-outline" href="javascript:history.back()">
        <i class="bi bi-arrow-left"></i> Go Back
      </a>
      <a class="btn-custom-primary" href="{{ url_for('index') }}">
        <i class="bi bi-grid-1x2"></i> Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
